{% extends "base.html" %}

{% block title %}
Login - Cyber Awareness Month
{% endblock %}


{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🔐
            </div>

            <span class="eyebrow">
                WELCOME BACK
            </span>

            <h1>
                Login
            </h1>

            <p>
                Continue your Cyber Awareness Month journey.
            </p>

        </div>


        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="button primary full-width"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create one
            </a>

        </div>

    </div>

</section>

{% endblock %}
