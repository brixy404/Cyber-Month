{% extends "base.html" %}

{% block title %}
Create Account - Cyber Awareness Month
{% endblock %}


{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🛡️
            </div>

            <span class="eyebrow">
                JOIN THE EXPERIENCE
            </span>

            <h1>
                Create your account
            </h1>

            <p>
                Register to participate in Cyber Awareness Month 2026.
            </p>

        </div>


        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="organization">
                    School / Organization
                </label>

                <input
                    type="text"
                    id="organization"
                    name="organization"
                    placeholder="Optional"
                >

            </div>


            <div class="form-group">

                <label for="participant_type">
                    I am participating as
                </label>

                <select
                    id="participant_type"
                    name="participant_type"
                >

                    <option value="Student">
                        Student
                    </option>

                    <option value="Teacher">
                        Teacher
                    </option>

                    <option value="IT Professional">
                        IT Professional
                    </option>

                    <option value="Organization">
                        Organization
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="button primary full-width"
            >
                Create My Account
            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</section>

{% endblock %}
